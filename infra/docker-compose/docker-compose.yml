services:
  postgres:
    image: postgres:16-alpine
    container_name: queue-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-queue_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-queue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queue_password}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ 로 이스케이프해야 compose 변수 치환이 아닌 컨테이너 셸 변수로 전달된다.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: queue-commerce-redis
    restart: unless-stopped
    # 대기열은 유실되면 순번이 통째로 사라지므로 AOF를 켜 둔다.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
